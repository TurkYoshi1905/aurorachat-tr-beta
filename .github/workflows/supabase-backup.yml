name: 🗄️ Supabase Otomatik Yedek

on:
  schedule:
    # Her gün saat 03:00 UTC (Türkiye 06:00)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      label:
        description: 'Yedek etiketi (isteğe bağlı)'
        required: false
        default: 'manuel'

jobs:
  backup:
    name: Veritabanı Yedekle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Yedek branch'ini çek
        uses: actions/checkout@v4
        with:
          ref: database-backups
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 PostgreSQL 17 istemcisini kur
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] \
            http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: 📁 Yedek klasörünü hazırla
        run: mkdir -p backups

      - name: 🗄️ Yedek al (roles + schema + data)
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          LABEL="${{ github.event.inputs.label || 'otomatik' }}"
          BACKUP_DIR="backups/${TIMESTAMP}_${LABEL}"
          mkdir -p "$BACKUP_DIR"

          # IPv4 Session Pooler — direkt DB host GitHub Actions'da IPv6 only olduğundan kullanılamaz
          POOLER_HOST="aws-1-ap-southeast-2.pooler.supabase.com"
          POOLER_USER="postgres.ktittqaubkaylprxnoya"
          DB_NAME="postgres"

          PG_DUMP="/usr/lib/postgresql/17/bin/pg_dump"
          PSQL="/usr/lib/postgresql/17/bin/psql"

          POOL_URL="postgresql://${POOLER_USER}:${PGPASSWORD}@${POOLER_HOST}:5432/${DB_NAME}?sslmode=require"

          echo "📋 Roller yedekleniyor (roles.sql)..."
          "$PSQL" "$POOL_URL" -t -A -c "
            SELECT
              'CREATE ROLE IF NOT EXISTS \"' || rolname || '\"' ||
              CASE WHEN rolsuper      THEN ' SUPERUSER'    ELSE ' NOSUPERUSER'   END ||
              CASE WHEN rolinherit    THEN ' INHERIT'      ELSE ' NOINHERIT'     END ||
              CASE WHEN rolcreaterole THEN ' CREATEROLE'   ELSE ' NOCREATEROLE'  END ||
              CASE WHEN rolcreatedb   THEN ' CREATEDB'     ELSE ' NOCREATEDB'    END ||
              CASE WHEN rolcanlogin   THEN ' LOGIN'        ELSE ' NOLOGIN'       END ||
              CASE WHEN rolbypassrls  THEN ' BYPASSRLS'    ELSE ' NOBYPASSRLS'   END ||
              ';'
            FROM pg_roles
            WHERE rolname NOT LIKE 'pg_%'
            ORDER BY rolname;
          " > "${BACKUP_DIR}/roles.sql"
          echo "  ✓ $(wc -l < "${BACKUP_DIR}/roles.sql") rol yedeklendi"

          echo "🏗️ Şema yedekleniyor (schema.sql)..."
          "$PG_DUMP" "$POOL_URL" \
            --schema-only \
            --no-owner \
            --no-acl \
            -f "${BACKUP_DIR}/schema.sql"
          echo "  ✓ $(wc -l < "${BACKUP_DIR}/schema.sql") satır"

          echo "💾 Veri yedekleniyor (data.sql)..."
          "$PG_DUMP" "$POOL_URL" \
            --data-only \
            --use-copy \
            -T "storage.buckets_vectors" \
            -T "storage.vector_indexes" \
            -f "${BACKUP_DIR}/data.sql"
          echo "  ✓ $(wc -l < "${BACKUP_DIR}/data.sql") satır"

          echo "🗜️ Arşivleniyor..."
          tar -czf "backups/backup_${TIMESTAMP}_${LABEL}.tar.gz" \
            -C backups "${TIMESTAMP}_${LABEL}/"
          rm -rf "$BACKUP_DIR"

          SIZE=$(du -sh "backups/backup_${TIMESTAMP}_${LABEL}.tar.gz" | cut -f1)
          FILENAME="backup_${TIMESTAMP}_${LABEL}.tar.gz"
          echo "✅ Yedek tamamlandı: ${FILENAME} (${SIZE})"
          echo "BACKUP_FILE=${FILENAME}" >> $GITHUB_ENV
          echo "BACKUP_SIZE=${SIZE}" >> $GITHUB_ENV

      - name: 🧹 Eski yedekleri temizle (son 30 adet tut)
        run: |
          cd backups
          COUNT=$(ls -1 *.tar.gz 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 30 ]; then
            ls -t *.tar.gz | tail -n +31 | xargs rm -f
            echo "🗑️ Eski yedekler silindi. Kalan: 30"
          else
            echo "📦 Toplam yedek sayısı: ${COUNT}"
          fi

      - name: 📊 Yedek listesini güncelle (INDEX.md)
        run: |
          cd backups
          echo "# AuroraChat Supabase Yedek Listesi" > INDEX.md
          echo "" >> INDEX.md
          echo "Son güncelleme: $(date '+%d.%m.%Y %H:%M UTC')" >> INDEX.md
          echo "" >> INDEX.md
          echo "Her \`.tar.gz\` arşivi içinde 3 dosya: \`roles.sql\` · \`schema.sql\` · \`data.sql\`" >> INDEX.md
          echo "" >> INDEX.md
          echo "| Dosya | Boyut | Tarih |" >> INDEX.md
          echo "|-------|-------|-------|" >> INDEX.md
          for f in $(ls -t *.tar.gz 2>/dev/null); do
            SIZE=$(du -sh "$f" | cut -f1)
            DATE=$(echo "$f" | grep -oP '\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2}' \
              | sed 's/_/ /' | sed 's/-/./g')
            echo "| \`${f}\` | ${SIZE} | ${DATE} |" >> INDEX.md
          done

      - name: 💾 Yedeki GitHub'a kaydet
        run: |
          git config user.email "asfurkan140@gmail.com"
          git config user.name "AuroraChat Backup Bot"
          git add backups/
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "🗄️ Yedek: $(date '+%d.%m.%Y %H:%M UTC') — ${{ env.BACKUP_FILE }} (${{ env.BACKUP_SIZE }})"
            git push
            echo "✅ GitHub'a kaydedildi!"
          fi
