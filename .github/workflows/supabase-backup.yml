name: 🗄️ Supabase Otomatik Yedek

on:
  schedule:
    # Her gün saat 03:00 UTC (Türkiye 06:00)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      label:
        description: 'Yedek etiketi (isteğe bağlı)'
        required: false
        default: 'manuel'

jobs:
  backup:
    name: Veritabanı Yedekle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Yedek branch'ini çek
        uses: actions/checkout@v4
        with:
          ref: database-backups
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📁 Yedek klasörünü hazırla
        run: mkdir -p backups

      - name: 🗄️ Supabase CLI ile yedek al (roles + schema + data)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          LABEL="${{ github.event.inputs.label || 'otomatik' }}"
          BACKUP_DIR="backups/${TIMESTAMP}_${LABEL}"
          mkdir -p "$BACKUP_DIR"

          DB_URL="postgresql://postgres:${DB_PASSWORD}@db.blifnflcwuadrryntskw.supabase.co:5432/postgres"

          echo "📋 Roller yedekleniyor..."
          npx supabase@latest db dump \
            --db-url "$DB_URL" \
            -f "${BACKUP_DIR}/roles.sql" \
            --role-only

          echo "🏗️ Şema yedekleniyor..."
          npx supabase@latest db dump \
            --db-url "$DB_URL" \
            -f "${BACKUP_DIR}/schema.sql"

          echo "💾 Veri yedekleniyor..."
          npx supabase@latest db dump \
            --db-url "$DB_URL" \
            -f "${BACKUP_DIR}/data.sql" \
            --use-copy \
            --data-only \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes"

          echo "🗜️ Arşivleniyor..."
          tar -czf "backups/backup_${TIMESTAMP}_${LABEL}.tar.gz" -C backups "${TIMESTAMP}_${LABEL}/"
          rm -rf "$BACKUP_DIR"

          SIZE=$(du -sh "backups/backup_${TIMESTAMP}_${LABEL}.tar.gz" | cut -f1)
          FILENAME="backup_${TIMESTAMP}_${LABEL}.tar.gz"
          echo "✅ Yedek alındı: ${FILENAME} (${SIZE})"
          echo "BACKUP_FILE=${FILENAME}" >> $GITHUB_ENV
          echo "BACKUP_SIZE=${SIZE}" >> $GITHUB_ENV

      - name: 🧹 Eski yedekleri temizle (son 30 adet tut)
        run: |
          cd backups
          COUNT=$(ls -1 *.tar.gz 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 30 ]; then
            ls -t *.tar.gz | tail -n +31 | xargs rm -f
            echo "🗑️ Eski yedekler silindi. Kalan: 30"
          else
            echo "📦 Toplam yedek sayısı: ${COUNT}"
          fi

      - name: 📊 Yedek listesini güncelle
        run: |
          cd backups
          echo "# AuroraChat Supabase Yedek Listesi" > INDEX.md
          echo "" >> INDEX.md
          echo "Son güncelleme: $(date '+%d.%m.%Y %H:%M UTC')" >> INDEX.md
          echo "" >> INDEX.md
          echo "Her arşiv içinde 3 dosya bulunur: \`roles.sql\`, \`schema.sql\`, \`data.sql\`" >> INDEX.md
          echo "" >> INDEX.md
          echo "| Dosya | Boyut | Tarih |" >> INDEX.md
          echo "|-------|-------|-------|" >> INDEX.md
          for f in $(ls -t *.tar.gz 2>/dev/null); do
            SIZE=$(du -sh "$f" | cut -f1)
            DATE=$(echo "$f" | grep -oP '\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2}' | sed 's/_/ /' | sed 's/-/\./g')
            echo "| \`${f}\` | ${SIZE} | ${DATE} |" >> INDEX.md
          done

      - name: 💾 Yedeki GitHub'a kaydet
        run: |
          git config user.email "asfurkan140@gmail.com"
          git config user.name "AuroraChat Backup Bot"
          git add backups/
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "🗄️ Yedek: $(date '+%d.%m.%Y %H:%M UTC') — ${{ env.BACKUP_FILE }} (${{ env.BACKUP_SIZE }})"
            git push
            echo "✅ Yedek başarıyla GitHub'a kaydedildi!"
          fi
